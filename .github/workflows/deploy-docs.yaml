---
name: Deploy docs
on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+rc[0-9]+'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# Deployments queue, as they all push to gh-pages; pull request builds cancel older ones
concurrency:
  group: >-
    ${{ github.workflow }}-${{
    github.event_name == 'pull_request' && github.ref || 'gh-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: Build docs
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pyversion: ["3.13"]

    # Grant GITHUB_TOKEN the permissions required to make a gh-pages deployment
    permissions:
      contents: write  # to let mkdocs write the new docs
      pages: write     # to deploy to Pages
      id-token: write  # allow to generate an OpenID Connect (OIDC) token

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # otherwise, you will fail to push refs to dest repo
          persist-credentials: false  # set only for the deploy steps

      - name: Configure git for the bot
        # Gives the bot that commits to gh-pages a name & email address
        # so that the commits have an author in the commit log.
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.pyversion }}
          enable-cache: false  # no cache in a workflow that publishes

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.pyversion }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install dependencies
        run: uv sync --group dev --no-progress

      - name: Generate schema documentation
        run: |
          just gen-doc

      # The if-conditions below make sure to select the right step, depending
      # on the job trigger. Only one of the steps below will run at a time.
      # The others will be skipped.

      - name: Check docs in pull requests with strict mode
        if: github.event_name == 'pull_request'
        run: |
          # XXX Enable strict mode once docs are clean
          echo "Strict check of docs disabled."
          # uv run mkdocs build --strict

      - name: Authenticate git for pushing to gh-pages
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          token_url="https://x-access-token:${GH_TOKEN}@github.com"
          git remote set-url origin "${token_url}/${GITHUB_REPOSITORY}.git"

      # yamllint disable rule:line-length
      - name: Build & deploy "dev" docs for a new commit to main

        if: (github.event_name == 'push' && github.ref_type != 'tag') || github.event_name == 'workflow_dispatch'
        run: |
          export SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          uv run mike deploy --push --update-aliases --title "dev (${SHORT_SHA})" dev

      - name: Build & deploy docs for a new version tag
        if: github.ref_type == 'tag' && github.event_name == 'push'
        run: |
          # Assigned first: a failing check inside the mike arguments would not stop the step
          docs_version_and_alias=$(uv run python scripts/check_release_tag.py "${GITHUB_REF_NAME}")
          # Unquoted on purpose: version and alias are two arguments
          uv run mike deploy --push --update-aliases ${docs_version_and_alias} latest
          uv run mike set-default latest --push
