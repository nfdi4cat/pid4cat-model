---
# https://pre-commit.com/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        # mkdocs.yml uses !!python/name tags unsupported by the safe YAML loader
        exclude: ^mkdocs\.yml$
      - id: end-of-file-fixer
        exclude: ^\.copier-answers\.yml$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]
        exclude: ^\.copier-answers\.yml$
        verbose: true  # Show warnings.

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.13.6
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      # Compares the schema with the newest release; needs the release tags
      - id: check-schema-version
        name: check that schema changes bump the schema version
        entry: uv run --no-dev python scripts/check_schema_version.py
        language: system
        files: ^src/pid4cat_model/schema/.*\.yaml$
        pass_filenames: false
